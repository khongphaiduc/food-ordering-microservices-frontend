server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Đã thêm try_files để hỗ trợ Single Page Application (React Router)
        # Nếu không tìm thấy file/thư mục tương ứng, Nginx sẽ điều hướng về index.html
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
